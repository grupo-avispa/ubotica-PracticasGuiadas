; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1-n16r8v]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8v
framework = espidf

monitor_speed = 115200

; To define char* variables, be careful with the required quotation marks. It's like '"<char*>"'. 
; In Linux it's even worse, you have to write the \ character before each special symbol
build_flags =
    -D CONFIG_WIFI_SSID='"<YOUR_SSID>"'          ; Name of the WiFi network to connect to
    -D CONFIG_WIFI_PASSWORD='"<YOUR_PASSWORD>"' ; Password of the WiFi network to connect to
    -D CONFIG_WIFI_MAXIMUM_RETRY=10         ; Maximum number of retries to connect to the WiFi network
    -D CONFIG_BROKER_URL='"mqtt://waspbrain.es"'   ;URL of the mqtt broker to connect to
    -D CONFIG_BROKER_PORT=1886              ; Port to connect to
    -D CONFIG_MQTT_USERNAME='"<YOUR_USERNAME>"'      ; Username for the MQTT server
    -D CONFIG_MQTT_PASSWORD='"<YOUR_PASSWORD>"'        ; Password for the MQTT server
    -D CONFIG_MQTT_TOPIC='"<YOUR_TOPIC>"' ; Topic to publish the messages to
    
; Debug through the built-in USB-Serial/JTAG of the ESP32-S3 (port labelled "USB", VID:PID 303a:1001)
build_type = debug
debug_tool = esp-builtin
debug_speed = 5000
; OpenOCD 0.11 (default) drops the built-in USB-JTAG on `reset halt`; 0.12 fixes it.
; debug_port forces TCP: PlatformIO Core 6.2 pipe mode uses `gdb port pipe`, removed in 0.12
debug_port = :3333
; GDB does not flash the firmware (OpenOCD `load` fails to erase this board's flash):
; run `./build.sh run -t upload` before debugging
debug_load_mode = manual
platform_packages =
    platformio/tool-openocd-esp32@2.1200.20230419
; Optional: also flash through the same port instead of the UART one
upload_protocol = esp-builtin    