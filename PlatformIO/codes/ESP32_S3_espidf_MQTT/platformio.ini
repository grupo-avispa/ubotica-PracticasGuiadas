; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1-n16r8v]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8v
framework = espidf

monitor_speed = 115200

; To define char* variables, be careful with the required quotation marks. It's like '"<char*>"'. 
; In Linux it's even worse, you have to write the \ character before each special symbol
build_flags =
    -D CONFIG_SSID='"clarc1"'
    -D CONFIG_PSSWD='"robotclarc1"'
    -D CONFIG_MQTT_BROKER='"mqtt://test.mosquitto.org"'   ;'"mqtt://waspbrain.es"'
    ;-D CONFIG_MQTT_PORT=1886
    ;-D CONFIG_MQTT_USERNAME='"pisito"'
    ;-D CONFIG_MQTT_PASSWORD='"wasp"'
    -D CONFIG_MQTT_TOPIC='"avispa/test/jp"'
