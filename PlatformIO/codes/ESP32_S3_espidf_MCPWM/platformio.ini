; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1-n16r8v]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8v
framework = espidf

; The values provided matches the GPIO ports used for the Left and Right Motors of the robot
build_flags =
     -D CONFIG_LEFT_BDC_MCPWM_GPIO_A=6      ; Left wheel: MCPWM signal A GPIO 
     -D CONFIG_LEFT_BDC_MCPWM_GPIO_B=7      ; Left wheel: MCPWM signal B GPIO
     -D CONFIG_LEFT_BDC_ENCODER_GPIO_A=15   ; Left wheel: Rotary encoder signal A GPIO
     -D CONFIG_LEFT_BDC_ENCODER_GPIO_B=16   ; Left wheel: Rotary encoder signal B GPIO
     -D CONFIG_RIGHT_BDC_MCPWM_GPIO_A=11     ; Right wheel: MCPWM signal A GPIO
     -D CONFIG_RIGHT_BDC_MCPWM_GPIO_B=12     ; Right wheel: MCPWM signal B GPIO
     -D CONFIG_RIGHT_BDC_ENCODER_GPIO_A=13   ; Right wheel: Rotary encoder signal A GPIO
     -D CONFIG_RIGHT_BDC_ENCODER_GPIO_B=14   ; Right wheel: Rotary encoder signal B GPIO

monitor_speed = 115200

; Debug through the built-in USB-Serial/JTAG of the ESP32-S3 (port labelled "USB", VID:PID 303a:1001)
build_type = debug
debug_tool = esp-builtin
debug_speed = 5000
; OpenOCD 0.11 (default) drops the built-in USB-JTAG on `reset halt`; 0.12 fixes it.
; debug_port forces TCP: PlatformIO Core 6.2 pipe mode uses `gdb port pipe`, removed in 0.12
debug_port = :3333
; GDB does not flash the firmware (OpenOCD `load` fails to erase this board's flash):
; run `./build.sh run -t upload` before debugging
debug_load_mode = manual
platform_packages =
    platformio/tool-openocd-esp32@2.1200.20230419
; Optional: also flash through the same port instead of the UART one
upload_protocol = esp-builtin