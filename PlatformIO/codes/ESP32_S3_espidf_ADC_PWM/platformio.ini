; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1-n16r8v]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8v
framework = espidf

build_flags =
     -D CONFIG_ADC1_CHAN_A=1     ; ADC_CHANNEL_1
     -D CONFIG_ADC1_CHAN_B=2     ; ADC_CHANNEL_2
     -D CONFIG_ADC_ATTEN=3       ; ADC_ATTEN_DB_12 = voltage range 0-3.9V
     -D CONFIG_PWM_OUTPUT=4      ; GPIO4 for LEDC (LED control) PWM output

monitor_speed = 115200

; Debug through the built-in USB-Serial/JTAG of the ESP32-S3 (port labelled "USB", VID:PID 303a:1001)
build_type = debug
debug_tool = esp-builtin
debug_speed = 5000
; OpenOCD 0.11 (default) drops the built-in USB-JTAG on `reset halt`; 0.12 fixes it.
; debug_port forces TCP: PlatformIO Core 6.2 pipe mode uses `gdb port pipe`, removed in 0.12
debug_port = :3333
; GDB does not flash the firmware (OpenOCD `load` fails to erase this board's flash):
; run `./build.sh run -t upload` before debugging
debug_load_mode = manual
platform_packages =
    platformio/tool-openocd-esp32@2.1200.20230419
; Optional: also flash through the same port instead of the UART one
upload_protocol = esp-builtin